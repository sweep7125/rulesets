name: Generate for server

on:
  workflow_run:
    workflows: ['Generate sources (flattened xray \+ cidr)']
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: server-from-sources-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  GOFLAGS: -buildvcs=false
  COMMIT_USER_NAME: github-actions[bot]
  COMMIT_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  # Stable builder releases; upstream data-only releases do not trigger rebuilds.
  DLC_SHA: fa3cb96fbc210b8d6466251a1d71b4a6e63a9c85
  V2GEOIP_SHA: fd96fbac6cffc06ab9a10d6ee8fad61afe9b771c

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository (partial clone)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none

      - name: Inspect server branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .ci/publish.py "$RUNNER_TEMP/publish.py"
          cp .ci/optimize.py "$RUNNER_TEMP/server-optimize.py"
          # Do not check out binary artifacts until we know a build is needed.
          if git fetch --no-tags --depth=3 --filter=blob:none origin \
             '+refs/heads/server:refs/remotes/origin/server'; then
            echo 'SERVER_EXISTS=1' >> "$GITHUB_ENV"
            echo "SERVER_HEAD=$(git rev-parse origin/server)" >> "$GITHUB_ENV"
          else
            set +e
            git ls-remote --exit-code --heads origin refs/heads/server >/dev/null
            status=$?
            set -e
            if (( status != 2 )); then
              echo "Cannot fetch server branch (ls-remote status: ${status})" >&2
              exit 1
            fi
            echo 'SERVER_EXISTS=0' >> "$GITHUB_ENV"
            echo 'SERVER_HEAD=' >> "$GITHUB_ENV"
          fi

      - name: Fetch one immutable sources snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          # Inspect only the two selected domain blobs and the abuse IP blob.
          git fetch --no-tags --depth=1 --filter=blob:none origin \
            '+refs/heads/sources:refs/remotes/origin/sources'

      - name: Resolve input revisions and decide builds
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail

          for category in oisd-big tif-full; do
            git rev-parse --verify -q "origin/sources:geosite/${category}.list" >/dev/null || {
              echo "Missing geosite/${category}.list" >&2
              exit 1
            }
          done
          oisd_blob="$(git rev-parse origin/sources:geosite/oisd-big.list)"
          tif_full_blob="$(git rev-parse origin/sources:geosite/tif-full.list)"
          git rev-parse --verify -q origin/sources:geoip/abuse.list >/dev/null || {
            echo 'Missing geoip/abuse.list' >&2
            exit 1
          }
          ip_blob="$(git rev-parse origin/sources:geoip/abuse.list)"

          # Xray-specific optimization depends on the version from main.
          # Rebuild geosite.dat whenever the optimizer changes, even when
          # all source lists are unchanged.
          optimizer_blob="$(git rev-parse --verify HEAD:.ci/optimize.py)"

          dlc_sha="$DLC_SHA"
          geoip_sha="$V2GEOIP_SHA"
          echo "dlc_sha=$dlc_sha" >> "$GITHUB_OUTPUT"
          echo "geoip_sha=$geoip_sha" >> "$GITHUB_OUTPUT"

          # Any change in server.yml invalidates both artifacts. As in the
          # original workflow, the canonical workflow lives on main.
          workflow_sha="$(git rev-parse HEAD:.github/workflows/server.yml)"

          empty_blob="$(git hash-object --stdin </dev/null)"
          for oid in "$oisd_blob" "$tif_full_blob" "$ip_blob"; do
            [[ "$oid" != "$empty_blob" ]] || { echo 'Required source is empty' >&2; exit 1; }
          done
          geosite_hash="$(printf '%s\n' "$oisd_blob" "$tif_full_blob" \
            "$optimizer_blob" "$dlc_sha" "$workflow_sha" | sha256sum | cut -d ' ' -f 1)"
          geoip_hash="$(printf '%s\n' "$ip_blob" "$optimizer_blob" "$geoip_sha" "$workflow_sha" \
            | sha256sum | cut -d ' ' -f 1)"

          echo "GEOSITE_BUILD_HASH=$geosite_hash" >> "$GITHUB_ENV"
          echo "GEOIP_BUILD_HASH=$geoip_hash" >> "$GITHUB_ENV"

          # Inspect server tree object IDs rather than materializing large .dat
          # files on an up-to-date run. Git hashes the empty blob deterministically.
          empty_blob="$(git hash-object --stdin </dev/null)"
          old_geosite_hash=''
          old_geoip_hash=''
          have_geosite=0
          have_geoip=0
          if [[ "$SERVER_EXISTS" == '1' ]]; then
            old_geosite_hash="$(git show origin/server:geosite.hash 2>/dev/null || true)"
            old_geoip_hash="$(git show origin/server:geoip.hash 2>/dev/null || true)"
            geosite_oid="$(git rev-parse -q --verify origin/server:geosite.dat 2>/dev/null || true)"
            geoip_oid="$(git rev-parse -q --verify origin/server:geoip.dat 2>/dev/null || true)"
            [[ -n "$geosite_oid" && "$geosite_oid" != "$empty_blob" ]] && have_geosite=1
            [[ -n "$geoip_oid" && "$geoip_oid" != "$empty_blob" ]] && have_geoip=1
          fi

          if [[ "$have_geosite" == '0' || "$old_geosite_hash" != "$geosite_hash" ]]; then
            echo 'geosite_needs_build=1' >> "$GITHUB_OUTPUT"
            echo 'Geosite requires a rebuild'
          else
            echo 'geosite_needs_build=0' >> "$GITHUB_OUTPUT"
            echo 'Geosite is up to date'
          fi

          if [[ "$have_geoip" == '0' || "$old_geoip_hash" != "$geoip_hash" ]]; then
            echo 'geoip_needs_build=1' >> "$GITHUB_OUTPUT"
            echo 'GeoIP requires a rebuild'
          else
            echo 'geoip_needs_build=0' >> "$GITHUB_OUTPUT"
            echo 'GeoIP is up to date'
          fi

      - name: Checkout server branch for changed artifacts
        if: steps.upstream.outputs.geosite_needs_build == '1' || steps.upstream.outputs.geoip_needs_build == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --local user.name "$COMMIT_USER_NAME"
          git config --local user.email "$COMMIT_USER_EMAIL"

          if [[ "$SERVER_EXISTS" == '1' ]]; then
            git switch -C server refs/remotes/origin/server
          else
            # The first successful build will create the branch with its files.
            git switch --orphan server
            git rm -r --ignore-unmatch . >/dev/null 2>&1 || true
          fi

      - name: Prepare geosite inputs (only when changed)
        if: steps.upstream.outputs.geosite_needs_build == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/server-inputs/geosite /tmp/server-output

          git show origin/sources:geosite/oisd-big.list > /tmp/server-inputs/geosite/oisd-big
          # Preserve the tif-full category name in geosite.dat.
          git show origin/sources:geosite/tif-full.list > /tmp/server-inputs/geosite/tif-full
          for category in oisd-big tif-full; do
            test -s "/tmp/server-inputs/geosite/${category}"
          done

      - name: Optimize geosite inputs for Xray
        if: steps.upstream.outputs.geosite_needs_build == '1'
        shell: bash
        run: |
          set -Eeuo pipefail

          # The sources branch uses --target preserve so that downstream
          # Mihomo rulesets retain their domain/full rules independently of
          # keyword/regexp rules. Apply the Xray-only coverage reduction here.
          # Always load the matching optimize.py from main, not from the
          # checked-out server branch.
          cp "$RUNNER_TEMP/server-optimize.py" /tmp/server-inputs/optimize.py
          test -s /tmp/server-inputs/optimize.py

          # Process one category at a time to limit peak memory usage.
          for category in oisd-big tif-full; do
            src="/tmp/server-inputs/geosite/${category}"
            dst="/tmp/server-inputs/geosite/${category}.xray"

            python3 /tmp/server-inputs/optimize.py domains "$src" "$dst" \
              --input-type xray --target xray-optimized

            test -s "${dst}.list"
            mv -f "${dst}.list" "$src"
          done

      - name: Prepare GeoIP input (only when changed)
        if: steps.upstream.outputs.geoip_needs_build == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/server-inputs /tmp/server-output
          git show origin/sources:geoip/abuse.list > /tmp/server-inputs/abuse-ipv4.list
          test -s /tmp/server-inputs/abuse-ipv4.list

      - name: Checkout domain-list-community builder (when needed)
        if: steps.upstream.outputs.geosite_needs_build == '1'
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          ref: ${{ steps.upstream.outputs.dlc_sha }}
          path: dlc
          fetch-depth: 1
          sparse-checkout: |
            internal
          sparse-checkout-cone-mode: true

      - name: Checkout GeoIP builder (when needed)
        if: steps.upstream.outputs.geoip_needs_build == '1'
        uses: actions/checkout@v7
        with:
          repository: v2fly/geoip
          ref: ${{ steps.upstream.outputs.geoip_sha }}
          path: v2geoip
          fetch-depth: 1
          sparse-checkout: |
            lib
            plugin
          sparse-checkout-cone-mode: true

      - name: Setup Go (only when building)
        if: steps.upstream.outputs.geosite_needs_build == '1' || steps.upstream.outputs.geoip_needs_build == '1'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: |
            dlc/go.sum
            v2geoip/go.sum

      - name: Build geosite.dat
        if: steps.upstream.outputs.geosite_needs_build == '1'
        shell: bash
        run: |
          set -Eeuo pipefail

          # No binary protobuf patching: OISD-BIG remains hyphenated.
          # Only the two selected files are passed to the DLC builder.
          mkdir -p dlc/data
          for category in oisd-big tif-full; do
            cp "/tmp/server-inputs/geosite/${category}" "dlc/data/${category}"
          done
          (
            cd dlc
            go run . -outputdir=/tmp/server-output
          )
          test -s /tmp/server-output/dlc.dat

          # GitHub refuses individual files over 100 MB. Catch this *before*
          # creating a commit that remote will reject.
          bytes="$(stat -c '%s' /tmp/server-output/dlc.dat)"
          if (( bytes >= 100000000 )); then
            echo "geosite.dat is ${bytes} bytes, at/above the GitHub 100 MB upload ceiling" >&2
            exit 1
          fi

          mv -f /tmp/server-output/dlc.dat geosite.dat
          printf '%s' "$GEOSITE_BUILD_HASH" > geosite.hash

      - name: Build geoip.dat
        if: steps.upstream.outputs.geoip_needs_build == '1'
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd v2geoip
            go build -o /tmp/server-output/geoip-builder .
          )

          jq -n --arg uri /tmp/server-inputs/abuse-ipv4.list '{
            input:[{type:"text",action:"add",args:{name:"abuse",uri:$uri,onlyIPType:"ipv4"}}],
            output:[{type:"v2rayGeoIPDat",action:"output",args:{outputDir:"/tmp/server-output",outputName:"geoip.dat"}}]
          }' > /tmp/server-inputs/geoip.config.json

          /tmp/server-output/geoip-builder -c /tmp/server-inputs/geoip.config.json
          test -s /tmp/server-output/geoip.dat
          mv -f /tmp/server-output/geoip.dat geoip.dat
          printf '%s' "$GEOIP_BUILD_HASH" > geoip.hash

      - name: Publish server outputs and bound history on unchanged runs
        id: commit_outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          : > /tmp/server-changed-outputs.txt
          if [[ '${{ steps.upstream.outputs.geosite_needs_build }}' == 1 || '${{ steps.upstream.outputs.geoip_needs_build }}' == 1 ]]; then
            for file in geosite.dat geoip.dat; do
              bytes="$(stat -c '%s' "$file")"
              (( bytes > 0 && bytes < 100000000 )) || { echo "$file exceeds GitHub size limit or is empty" >&2; exit 1; }
            done
            git add -- geosite.dat geosite.hash geoip.dat geoip.hash
            git diff --cached --name-only -- geosite.dat geosite.hash geoip.dat geoip.hash > /tmp/server-changed-outputs.txt
            tree="$(git write-tree)"
          else
            tree="$(git rev-parse 'origin/server^{tree}')"
          fi
          python3 "$RUNNER_TEMP/publish.py" --branch server --tree "$tree" \
            --expected "$SERVER_HEAD" --message "Update server geofiles $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          if [[ -s /tmp/server-changed-outputs.txt ]]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

      - name: Purge changed jsDelivr files
        if: steps.commit_outputs.outputs.changed == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r filename; do
            curl -fsS --retry 3 --retry-delay 2 --connect-timeout 10 \
              --max-time 30 \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@server/${filename}"
          done < /tmp/server-changed-outputs.txt
